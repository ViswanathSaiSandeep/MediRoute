name: e2e.yml

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Override BASE_URL for testing'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.32.0'
  BASE_URL: ${{ github.event.inputs.base_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # BUILD & DEPLOY — prerequisite for all test jobs
  # ═══════════════════════════════════════════════════════════════════════════
  build-and-deploy:
    runs-on: ubuntu-latest
    outputs:
      deploy_url: ${{ env.BASE_URL }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Flutter"
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: "Install Flutter Dependencies"
        run: flutter pub get

      - name: "Build Flutter Web"
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          if [ -n "$MAPS_API_KEY" ]; then
            sed -i "s/YOUR_GOOGLE_MAPS_API_KEY/${MAPS_API_KEY}/g" web/index.html
          fi
          flutter build web --release --base-href "/${REPO_NAME}/" \
            --dart-define=GEMINI_API_KEY="${GEMINI_API_KEY}"
          cp build/web/index.html build/web/404.html
          echo "Build output:"
          ls -la build/web/

      - name: "Static Analysis"
        run: flutter analyze --no-fatal-infos || true

      - name: "Deploy to GitHub Pages"
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy MediRoute to GitHub Pages [ci skip]"

      - name: "Wait for GitHub Pages CDN Propagation"
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          echo "Waiting 90 seconds for GitHub Pages CDN propagation..."
          sleep 90

  # ═══════════════════════════════════════════════════════════════════════════
  # 🌐 Selenium — Website Tests (300)
  # ═══════════════════════════════════════════════════════════════════════════
  selenium-website-tests:
    name: "🌐 Selenium — Website Tests (300)"
    needs: build-and-deploy
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ needs.build-and-deploy.outputs.deploy_url }}
    steps:
      - uses: actions/checkout@v4

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Install Dependencies"
        run: pip install -r automation/requirements.txt

      - name: "Install Chrome & ChromeDriver"
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - uses: nanasess/setup-chromedriver@v2

      - name: "Verify Deployment"
        run: |
          cd automation
          python -c "
          import sys; sys.path.insert(0, '.')
          from utils.verify_deployment import verify_deployment
          result = verify_deployment('${{ env.BASE_URL }}')
          print(f'Deployment Status: {result[\"status\"]}')
          for c in result['checks']:
              print(f'  {c[\"name\"]}: {c[\"status\"]} — {c[\"detail\"]}')
          if result['status'] == 'FAIL':
              sys.exit(1)
          "

      - name: "Run Selenium E2E Tests"
        env:
          HEADLESS: "true"
          DISPLAY: ":99"
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1920x1080x24 &
          cd automation
          python -m pytest tests/ \
            -v --tb=short --no-header --timeout=120 --rootdir=. \
            2>&1 | tee test_output.log || true

      - name: "Generate Reports"
        if: always()
        run: |
          cd automation
          python -c "
          import sys, os, json
          sys.path.insert(0, '.')
          from config.settings import REPORTS_DIR
          os.makedirs(REPORTS_DIR, exist_ok=True)
          results_path = os.path.join(REPORTS_DIR, 'execution-results.json')
          if os.path.exists(results_path):
              print('Reports generated by conftest hooks.')
          else:
              print('Generating fallback reports...')
              results = []
              if os.path.exists('test_output.log'):
                  with open('test_output.log') as f:
                      for line in f:
                          if ' PASSED' in line or ' FAILED' in line or ' SKIPPED' in line:
                              parts = line.strip().split('::')
                              if len(parts) >= 2:
                                  status = 'PASSED' if 'PASSED' in line else 'FAILED' if 'FAILED' in line else 'SKIPPED'
                                  test_name = parts[-1].split(' ')[0]
                                  module = parts[0].split('/')[-1].replace('test_','').replace('.py','')
                                  results.append({
                                      'test_id': test_name.upper().replace('TEST_',''),
                                      'module': module.replace('_',' ').title(),
                                      'test_name': test_name,
                                      'status': status,
                                      'duration': 1.0,
                                      'priority': 'Medium',
                                      'error': '',
                                      'precondition': 'App loaded',
                                      'expected': 'Test passes',
                                      'actual': status,
                                      'category': 'Selenium Website Tests',
                                  })
              if results:
                  from utils.report_generator import generate_html_report, generate_dashboard
                  from utils.excel_generator import generate_all_excel_reports
                  from utils.summary_generator import generate_summary_md, generate_json_results
                  summary = {'total': len(results), 'passed': len([r for r in results if r['status']=='PASSED']),
                             'failed': len([r for r in results if r['status']=='FAILED']),
                             'skipped': len([r for r in results if r['status']=='SKIPPED'])}
                  generate_html_report(results, summary)
                  generate_dashboard(results, summary)
                  generate_all_excel_reports(results)
                  generate_summary_md(results)
                  generate_json_results(results, summary)
                  try:
                      from shared.category_report import generate_category_reports
                      generate_category_reports(results, 'Selenium Website Tests', REPORTS_DIR)
                  except Exception: pass
                  print(f'Generated fallback reports for {len(results)} tests.')
          "

      - name: "Upload Selenium Reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-website-test-reports
          path: |
            automation/reports/
            automation/screenshots/
            automation/logs/
          retention-days: 30

      - name: "Publish Summary"
        if: always()
        run: |
          SUMMARY="automation/reports/summary.md"
          if [ -f "$SUMMARY" ]; then
            echo "## 🌐 Selenium Website Test Results" >> $GITHUB_STEP_SUMMARY
            cat "$SUMMARY" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ No Selenium summary available" >> $GITHUB_STEP_SUMMARY
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # 📱 Appium — Android Tests (300)
  # ═══════════════════════════════════════════════════════════════════════════
  appium-android-tests:
    name: "📱 Appium — Android Tests (300)"
    needs: build-and-deploy
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ needs.build-and-deploy.outputs.deploy_url }}
    steps:
      - uses: actions/checkout@v4

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Setup Java"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: "Setup Android SDK"
        uses: android-actions/setup-android@v3

      - name: "Install Appium & Dependencies"
        run: |
          npm install -g appium
          appium driver install uiautomator2
          pip install -r automation/appium/requirements.txt

      - name: "Enable KVM"
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: "Run Appium Tests on Emulator"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            echo "Emulator started"
            adb devices

            # Start Appium
            appium --address 127.0.0.1 --port 4723 --relaxed-security &
            sleep 10

            # Run tests
            cd automation/appium
            python -m pytest tests/ \
              -v --tb=short --no-header --timeout=180 --rootdir=. \
              2>&1 | tee appium_test_output.log || true

            # Generate reports
            python -c "
            import sys, os
            sys.path.insert(0, '.')
            from utils.appium_report_generator import generate_all_appium_reports
            generate_all_appium_reports()
            print('Appium reports generated.')
            "

      - name: "Upload Appium Reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-android-test-reports
          path: |
            automation/appium/reports/
            automation/appium/screenshots/
            automation/appium/logs/
          retention-days: 30

      - name: "Publish Summary"
        if: always()
        run: |
          SUMMARY="automation/appium/reports/summary.md"
          if [ -f "$SUMMARY" ]; then
            echo "## 📱 Appium Android Test Results" >> $GITHUB_STEP_SUMMARY
            cat "$SUMMARY" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ No Appium summary available" >> $GITHUB_STEP_SUMMARY
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # ✏️ Unit Tests — API (300)
  # ═══════════════════════════════════════════════════════════════════════════
  unit-tests-api:
    name: "✏️ Unit Tests — API (300)"
    needs: build-and-deploy
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ needs.build-and-deploy.outputs.deploy_url }}
    steps:
      - uses: actions/checkout@v4

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Install Dependencies"
        run: pip install -r automation/requirements.txt

      - name: "Run Unit Tests"
        run: |
          cd automation
          python -m pytest unit/tests/ \
            -v --tb=short --no-header --timeout=120 --rootdir=unit \
            2>&1 | tee unit_test_output.log || true

      - name: "Upload Unit Test Reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-api-reports
          path: automation/unit/reports/
          retention-days: 30

      - name: "Publish Summary"
        if: always()
        run: |
          SUMMARY="automation/unit/reports/summary.md"
          if [ -f "$SUMMARY" ]; then
            echo "## ✏️ Unit Tests — API Results" >> $GITHUB_STEP_SUMMARY
            cat "$SUMMARY" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ No Unit Test summary available" >> $GITHUB_STEP_SUMMARY
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # ✅ Validation Tests (300)
  # ═══════════════════════════════════════════════════════════════════════════
  validation-tests:
    name: "✅ Validation Tests (300)"
    needs: build-and-deploy
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ needs.build-and-deploy.outputs.deploy_url }}
    steps:
      - uses: actions/checkout@v4

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Install Dependencies"
        run: pip install -r automation/requirements.txt

      - name: "Run Validation Tests"
        run: |
          cd automation
          python -m pytest validation/tests/ \
            -v --tb=short --no-header --timeout=120 --rootdir=validation \
            2>&1 | tee validation_test_output.log || true

      - name: "Upload Validation Reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-tests-reports
          path: automation/validation/reports/
          retention-days: 30

      - name: "Publish Summary"
        if: always()
        run: |
          SUMMARY="automation/validation/reports/summary.md"
          if [ -f "$SUMMARY" ]; then
            echo "## ✅ Validation Test Results" >> $GITHUB_STEP_SUMMARY
            cat "$SUMMARY" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ No Validation summary available" >> $GITHUB_STEP_SUMMARY
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # 🚀 Deployment Status (300)
  # ═══════════════════════════════════════════════════════════════════════════
  deployment-status:
    name: "🚀 Deployment Status (300)"
    needs: build-and-deploy
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ needs.build-and-deploy.outputs.deploy_url }}
    steps:
      - uses: actions/checkout@v4

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Install Dependencies"
        run: pip install -r automation/requirements.txt

      - name: "Run Deployment Tests"
        run: |
          cd automation
          python -m pytest deployment_tests/tests/ \
            -v --tb=short --no-header --timeout=120 --rootdir=deployment_tests \
            2>&1 | tee deployment_test_output.log || true

      - name: "Upload Deployment Reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-status-reports
          path: automation/deployment_tests/reports/
          retention-days: 30

      - name: "Publish Summary"
        if: always()
        run: |
          SUMMARY="automation/deployment_tests/reports/summary.md"
          if [ -f "$SUMMARY" ]; then
            echo "## 🚀 Deployment Status Results" >> $GITHUB_STEP_SUMMARY
            cat "$SUMMARY" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ No Deployment summary available" >> $GITHUB_STEP_SUMMARY
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # 📊 Load Testing — Performance (300)
  # ═══════════════════════════════════════════════════════════════════════════
  load-testing-performance:
    name: "📊 Load Testing — Performance (300)"
    needs: build-and-deploy
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ needs.build-and-deploy.outputs.deploy_url }}
    steps:
      - uses: actions/checkout@v4

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Install Dependencies"
        run: pip install -r automation/requirements.txt

      - name: "Run Load Tests"
        run: |
          cd automation
          python -m pytest load/tests/ \
            -v --tb=short --no-header --timeout=300 --rootdir=load \
            2>&1 | tee load_test_output.log || true

      - name: "Upload Load Test Reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-testing-performance-reports
          path: automation/load/reports/
          retention-days: 30

      - name: "Publish Summary"
        if: always()
        run: |
          SUMMARY="automation/load/reports/summary.md"
          if [ -f "$SUMMARY" ]; then
            echo "## 📊 Load Testing Results" >> $GITHUB_STEP_SUMMARY
            cat "$SUMMARY" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ No Load Testing summary available" >> $GITHUB_STEP_SUMMARY
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # 📋 Compile Master Report & Deploy
  # ═══════════════════════════════════════════════════════════════════════════
  compile-master-report:
    name: "📋 Compile Master Report & Deploy"
    needs:
      - build-and-deploy
      - selenium-website-tests
      - appium-android-tests
      - unit-tests-api
      - validation-tests
      - deployment-status
      - load-testing-performance
    if: always()
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ needs.build-and-deploy.outputs.deploy_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Install Dependencies"
        run: pip install -r automation/requirements.txt

      - name: "Download All Test Artifacts"
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: "Assemble Category Reports"
        run: |
          # Copy each category's reports to the expected directory structure
          for dir_pair in \
            "selenium-website-test-reports/reports:automation/reports" \
            "appium-android-test-reports/reports:automation/appium/reports" \
            "unit-tests-api-reports:automation/unit/reports" \
            "validation-tests-reports:automation/validation/reports" \
            "deployment-status-reports:automation/deployment_tests/reports" \
            "load-testing-performance-reports:automation/load/reports"; do
            SRC="downloaded-artifacts/$(echo $dir_pair | cut -d: -f1)"
            DST="$(echo $dir_pair | cut -d: -f2)"
            if [ -d "$SRC" ]; then
              mkdir -p "$DST"
              cp -r "$SRC"/* "$DST"/ 2>/dev/null || true
              echo "✅ Copied $SRC → $DST"
            else
              echo "⚠️ Missing: $SRC"
            fi
          done

      - name: "Compile Master Report"
        run: |
          cd automation
          python -c "
          import sys; sys.path.insert(0, '.')
          from utils.master_report_compiler import compile_master_report
          result = compile_master_report(base_dir='..')
          s = result['summary']
          print(f'Master Report: {s[\"grand_total\"]} tests, {s[\"grand_pass_rate\"]}% pass rate')
          print(f'  Passed: {s[\"grand_passed\"]}')
          print(f'  Failed: {s[\"grand_failed\"]}')
          print(f'  Skipped: {s[\"grand_skipped\"]}')
          "

      - name: "Security Scan — No Hardcoded API Keys"
        run: |
          cd automation
          python -c "
          import sys; sys.path.insert(0, '.')
          from shared.security_scan import scan_for_secrets
          issues = scan_for_secrets('..')
          if issues:
              print('❌ SECURITY ISSUES FOUND:')
              for issue in issues:
                  print(f'  {issue}')
              # Warning only — don't fail the build
          else:
              print('✅ No hardcoded API keys or secrets detected.')
          "

      - name: "Upload Master Report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-test-report
          path: Test Results/
          retention-days: 30

      - name: "Publish Master Summary"
        if: always()
        run: |
          SUMMARY="Test Results/Summary/summary.md"
          if [ -f "$SUMMARY" ]; then
            cat "$SUMMARY" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ No master summary available" >> $GITHUB_STEP_SUMMARY
          fi

      - name: "Evaluate Pass/Fail Threshold"
        if: always()
        run: |
          RESULTS="Test Results/JSON/execution-results.json"
          if [ ! -f "$RESULTS" ]; then
            echo "No master results file found."
            exit 0
          fi
          python -c "
          import json, sys
          with open('$RESULTS') as f:
              data = json.load(f)
          s = data.get('summary', {})
          total = s.get('grand_total', 0)
          passed = s.get('grand_passed', 0)
          failed = s.get('grand_failed', 0)
          if total == 0:
              print('No tests executed.')
              sys.exit(0)
          pass_rate = passed / total * 100
          fail_rate = failed / total * 100
          print(f'Pass Rate: {pass_rate:.1f}% | Failed: {failed}/{total} ({fail_rate:.1f}%)')
          if pass_rate < 95 and fail_rate > 5:
              print('❌ THRESHOLD BREACH: Pass rate < 95% and critical failures > 5%')
              sys.exit(1)
          else:
              print('✅ Within acceptable thresholds')
          "

      - name: "Store Historical Results"
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          RESULTS="Test Results/JSON/execution-results.json"
          if [ -f "$RESULTS" ]; then
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            TMP="/tmp/results_${TIMESTAMP}.json"
            cp "$RESULTS" "$TMP"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git stash --include-untracked || true
            git fetch origin test-history || true
            git checkout test-history 2>/dev/null || git checkout --orphan test-history
            mkdir -p results
            cp "$TMP" "results/results_${TIMESTAMP}.json"
            git add results/ || true
            git commit -m "E2E results ${TIMESTAMP} [ci skip]" || true
            git push origin test-history || true
          fi
